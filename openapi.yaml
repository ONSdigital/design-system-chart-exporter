openapi: 3.1.0
info:
  title: ONS Chart Exporter
  summary: Render an ONS Design System chart configuration to a PNG and store it privately.
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health
      description: "Returns the service health status per the DP health check specification.\n\
        \nA dead browser makes the service CRITICAL (it cannot render), reported\n\
        with HTTP 500 so orchestrators stop routing traffic to this instance.\nA degraded-but-serving\
        \ check would be WARNING -> HTTP 429."
      operationId: health_health_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "429":
          description: Service is degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /charts:
    post:
      summary: Create Chart
      description: Render the chart config to a PNG, store it privately, and return
        its metadata.
      operationId: create_chart_charts_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChartRenderRequest"
        required: true
      responses:
        "201":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartObjectResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "413":
          description: Content Too Large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "415":
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDocument"
components:
  schemas:
    ChartObjectResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
        bucket:
          type: string
          title: Bucket
        key:
          type: string
          title: Key
        content_type:
          type: string
          title: Content Type
        size_bytes:
          type: integer
          title: Size Bytes
        width:
          type: integer
          title: Width
        height:
          type: integer
          title: Height
      type: object
      required:
        - id
        - created_at
        - bucket
        - key
        - content_type
        - size_bytes
        - width
        - height
      title: ChartObjectResponse
      description: "201 response body: metadata of the stored chart object."
    ChartRenderRequest:
      properties:
        language:
          type: string
          const: en
          title: Language
        device:
          type: string
          const: desktop
          title: Device
        chart_config:
          additionalProperties: true
          type: object
          title: Chart Config
      additionalProperties: false
      type: object
      required:
        - language
        - device
        - chart_config
      title: ChartRenderRequest
      description: "Body of POST /charts.\n\nchart_config is an opaque vendor payload\
        \ owned by the Design System\ncontract (camelCase, Highcharts-derived). We\
        \ validate only that it is a\nnon-empty object \u2014 never its internal fields,\
        \ so the contract can evolve\nwithout changes here."
    Check:
      properties:
        name:
          type: string
          title: Name
        status:
          type: string
          enum:
            - OK
            - WARNING
            - CRITICAL
          title: Status
        status_code:
          anyOf:
            - type: integer
            - type: "null"
          title: Status Code
        message:
          type: string
          title: Message
        last_checked:
          anyOf:
            - type: string
            - type: "null"
          title: Last Checked
        last_success:
          anyOf:
            - type: string
            - type: "null"
          title: Last Success
        last_failure:
          anyOf:
            - type: string
            - type: "null"
          title: Last Failure
      type: object
      required:
        - name
        - status
        - message
        - last_checked
        - last_success
        - last_failure
      title: Check
      description: Result of an individual health check.
    ErrorDocument:
      properties:
        errors:
          items:
            $ref: "#/components/schemas/ErrorItem"
          type: array
          maxItems: 50
          title: Errors
      type: object
      required:
        - errors
      title: ErrorDocument
      description: Envelope returned by every non-2xx response.
    ErrorItem:
      properties:
        code:
          type: string
          title: Code
        description:
          type: string
          title: Description
      type: object
      required:
        - code
        - description
      title: ErrorItem
      description: A single error in the spec's error document.
    HealthResponse:
      properties:
        status:
          type: string
          enum:
            - OK
            - WARNING
            - CRITICAL
          title: Status
        version:
          $ref: "#/components/schemas/VersionInfo"
        uptime:
          type: integer
          title: Uptime
        start_time:
          type: string
          title: Start Time
        checks:
          items:
            $ref: "#/components/schemas/Check"
          type: array
          maxItems: 20
          title: Checks
      type: object
      required:
        - status
        - version
        - uptime
        - start_time
        - checks
      title: HealthResponse
      description: Response body for the health check endpoint.
    VersionInfo:
      properties:
        version:
          type: string
          title: Version
        git_commit:
          type: string
          title: Git Commit
        build_time:
          type: string
          title: Build Time
        language:
          type: string
          title: Language
        language_version:
          type: string
          title: Language Version
      type: object
      required:
        - version
        - git_commit
        - build_time
        - language
        - language_version
      title: VersionInfo
      description: Version details for the running service.

---
# https://github.com/bridgecrewio/checkov
compact: true
download-external-modules: false
evaluate-variables: true
output: cli
quiet: true
soft-fail: false
skip-check:
  # Ensure top-level permissions are not set to write-all
  - CKV2_GHA_1
  # Skip container HEALTHCHECK requirement (CKV_DOCKER_2); health is handled externally
  - CKV_DOCKER_2
  # The API only exposes a public /health endpoint; no auth is required by design
  - CKV_OPENAPI_4
  - CKV_OPENAPI_5
summary-position: bottom

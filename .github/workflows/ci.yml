---
name: CI
permissions:
  contents: read
  pull-requests: write

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: "${{ github.head_ref || github.ref }}-${{ github.workflow }}"
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint and Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        run: pipx install uv==0.11.29

      - name: Install dependencies
        run: make install-dev

      - name: Lint Python
        run: make lint

      # Chromium's system libraries are needed for the slow (real-browser) and
      # e2e test layers. The browser binary itself is installed by `make
      # test-all` (playwright-browsers target).
      - name: Install Playwright system dependencies
        run: uv run playwright install-deps chromium

      # Start the local S3 emulator so the e2e layer actually runs; without it
      # the e2e tests fail under CI (they only skip locally).
      - name: Start local infrastructure (Floci S3)
        run: make up-deps

      - name: Test
        run: make test-all

      - name: Stop local infrastructure
        if: always()
        run: docker compose down --volumes
